# CI de seguridad y calidad (docs/013-Seguridad/04; puntos 1, 2, 18 y 19).
# Corre en cada push y pull request a main. Ningún merge sin esto en verde.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests + RLS real + bandit + pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: merchly
          POSTGRES_PASSWORD: ci_admin_password
          POSTGRES_DB: merchly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U merchly -d merchly"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Solo valores de CI, sin ningún valor real.
      JWT_SECRET_KEY: ci-solo-para-tests-0123456789-abcdefghijklmnopqrstuvwxyz
      DB_APP_PASSWORD: ci_app_password
      DATABASE_URL_MIGRACIONES: postgresql://merchly:ci_admin_password@localhost:5432/merchly
      DATABASE_URL: postgresql://merchly_app:ci_app_password@localhost:5432/merchly
      TEST_DATABASE_ADMIN_URL: postgresql://merchly:ci_admin_password@127.0.0.1:5432/merchly
      TEST_DATABASE_APP_URL: postgresql://merchly_app:ci_app_password@127.0.0.1:5432/merchly
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint de seguridad y errores (bandit + pyflakes vía ruff, reglas S y F)
        run: ruff check app scripts alembic --select S,F
      - name: Migraciones (crean el rol merchly_app y RLS)
        run: alembic upgrade head
      - name: Tests (unitarios + integración RLS/IDOR contra Postgres real)
        run: pytest -q
      - name: Los tests de integración no se saltearon
        run: pytest -q app/tests/test_integracion_seguridad_db.py -rs | tee /tmp/integ.txt && ! grep -q "SKIPPED" /tmp/integ.txt
      - name: Auditoría de dependencias de producción
        run: pip-audit -r requirements.txt --strict

  frontend:
    name: Frontend (tipos + lint + build + npm audit + bundle sin secretos)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npm run build
      - name: npm audit (falla con hallazgos altos o críticos)
        run: npm audit --audit-level=high
      - name: Ninguna credencial de base de datos ni secreto en el bundle del navegador (punto 19)
        run: |
          if grep -rEl "postgres(ql)?://|DATABASE_URL|DB_APP_PASSWORD|merchly_app|JWT_SECRET|service_role|REDIS_PASSWORD" .next/static; then
            echo "::error::Se encontró una credencial o URL de base de datos en el bundle del cliente"
            exit 1
          fi
      - name: Ninguna variable NEXT_PUBLIC_ con pinta de secreto
        run: |
          if grep -rEn "NEXT_PUBLIC_[A-Z_]*(SECRET|PASSWORD|TOKEN|KEY|DATABASE)" --include=*.ts --include=*.tsx app components lib proxy.ts; then
            echo "::error::Las variables NEXT_PUBLIC_* se exponen al navegador: nunca secretos"
            exit 1
          fi

  secretos:
    name: Escaneo de secretos (gitleaks, historial completo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source /repo --redact --no-banner --exit-code 1

  imagen:
    name: Imagen Docker del backend (trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t merchly-backend:ci backend
      # Solo vulnerabilidades: el escaneo de secretos de trivy da falsos
      # positivos con claves de EJEMPLO de la documentación de PyJWT y
      # google-auth. Los secretos del repo los cubre el job de gitleaks.
      - name: Escanear vulnerabilidades altas y críticas
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.0 \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 merchly-backend:ci
