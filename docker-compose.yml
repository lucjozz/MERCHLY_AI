name: merchly-ai

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: merchly-backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    container_name: merchly-db
    environment:
      POSTGRES_USER: merchly
      POSTGRES_PASSWORD: merchly
      POSTGRES_DB: merchly
    ports:
      - "5432:5432"
    volumes:
      - merchly_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merchly -d merchly"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: merchly-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  merchly_pgdata:
